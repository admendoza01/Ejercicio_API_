
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predictor de Retrasos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="container">
        <h1>Predictor de retrasos en entregas</h1>
        <p>Evalúa el riesgo de que tu pedido llegue tarde.</p>

        <form id="formulario">
            <label for="codigo_pedido">Código del pedido</label>
            <input id="codigo_pedido" name="codigo_pedido"
                   minlength="3" maxlength="30" required
                   placeholder="PED-001">

            <label for="distancia_km">Distancia (km)</label>
            <input id="distancia_km" name="distancia_km"
                   type="number" min="0.1" max="5000"
                   step="0.1" required>

            <label for="tipo_envio">Tipo de envío</label>
            <select id="tipo_envio" name="tipo_envio" required>
                <option value="express">Exprés</option>
                <option value="estandar" selected>Estándar</option>
                <option value="economico">Económico</option>
            </select>

            <label for="horas_desde_pedido">
                Horas desde el pedido
            </label>
            <input id="horas_desde_pedido"
                   name="horas_desde_pedido"
                   type="number" min="0" max="720"
                   step="1" required>

            <label class="check">
                <input type="checkbox" id="es_festivo">
                Es festivo
            </label>

            <label class="check">
                <input type="checkbox" id="clima_adverso">
                Hay condiciones meteorológicas adversas
            </label>

            <label class="check">
                <input type="checkbox" id="zona_remota">
                El destino es una zona remota
            </label>

            <button type="submit">Evaluar pedido</button>
        </form>

        <section id="resultado" hidden aria-live="polite">
            <h2>Resultado de la evaluación</h2>
            <div id="contenido"></div>
        </section>

        <p id="error" role="alert"></p>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
